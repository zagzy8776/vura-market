name: Release expired inventory reservations

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/release-expired-reservations.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
