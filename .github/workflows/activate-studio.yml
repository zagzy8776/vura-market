name: Activate rich Studio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.event.head_commit.message != 'Activate rich Studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make Studio loader robust and remove duplicate shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          studio = Path('src/StudioApp.tsx')
          s = studio.read_text()
          old = '''      const [o, ord, prod, sup, cus, note] = await Promise.all([\n        fetch('/api/admin/overview', { credentials: 'include' }).then(r => r.json()),\n        fetch('/api/admin/orders', { credentials: 'include' }).then(r => r.json()),\n        fetch('/api/admin/products', { credentials: 'include' }).then(r => r.json()),\n        fetch('/api/admin/suppliers', { credentials: 'include' }).then(r => r.json()),\n        fetch('/api/admin/customers', { credentials: 'include' }).then(r => r.json()),\n        fetch('/api/admin/notifications', { credentials: 'include' }).then(r => r.json()),\n      ]);'''
          new = '''      const o = await fetch('/api/admin/overview', { credentials: 'include' }).then(r => r.json());\n      const ord = await fetch('/api/admin/orders', { credentials: 'include' }).then(r => r.json());\n      const prod = await fetch('/api/admin/products', { credentials: 'include' }).then(r => r.json());\n      const sup = await fetch('/api/admin/suppliers', { credentials: 'include' }).then(r => r.json());\n      const cus = { customers: o.customers || [] };\n      const note = { notifications: o.notifications || [] };'''
          if old in s:
              s = s.replace(old, new)
          studio.write_text(s)
          old_studio = Path('src/pages/studio/Studio.tsx')
          if old_studio.exists():
              old_studio.unlink()
          wf = Path('.github/workflows/activate-studio.yml')
          wf.unlink()
          PY
      - name: Commit active Studio cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/StudioApp.tsx src/pages/studio/Studio.tsx .github/workflows/activate-studio.yml
          git diff --cached --quiet && exit 0
          git commit -m "Activate rich Studio"
          git push
