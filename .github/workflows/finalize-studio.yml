name: finalize-studio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Finalize Studio source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean unused Studio imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/StudioApp.tsx')
          s = p.read_text()
          s = s.replace('  Bell, Check, ChevronRight, CircleDollarSign, Clock3, FileText, Filter, LayoutDashboard,\n  Loader2, LogOut, Package, Plus, RefreshCw, Search, ShieldCheck, ShoppingBag, Store,\n  Truck, UserRound, X, AlertTriangle, MoreHorizontal, Eye, Archive, CreditCard,', '  Bell, Check, ChevronRight, CircleDollarSign, Clock3, FileText, LayoutDashboard,\n  Package, Plus, RefreshCw, Search, ShieldCheck, ShoppingBag, Store,\n  Truck, UserRound, X, AlertTriangle, Eye, Archive, CreditCard,')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/StudioApp.tsx .github/workflows/finalize-studio.yml
          git commit -m "Finalize Studio source" || exit 0
          git push
