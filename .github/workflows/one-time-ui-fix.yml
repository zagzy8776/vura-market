name: one-time-ui-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply production UI fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair storefront runtime issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace(
              'ArrowLeft, ArrowRight, Bell,',
              'ArrowLeft, ArrowRight, ArrowUpRight, Bell,'
          )
          s = s.replace(
              'Header user={user} view={view}',
              'Header categories={categories} user={user} view={view}'
          )
          s = s.replace(
              'function Header({ user, view, onView, onAuth, onSearch, search, onMenu }:',
              'function Header({ categories, user, view, onView, onAuth, onSearch, search, onMenu }:'
          )
          app.write_text(s)

          public = Path('public')
          public.mkdir(exist_ok=True)
          (public / 'favicon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#5b35f5"/><path d="M35 8 16 36h14l-2 20 20-28H34z" fill="white"/></svg>''')

          index = Path('index.html')
          html = index.read_text()
          if 'favicon.svg' not in html:
              html = html.replace('<title>Vura — Find what fits your life</title>', '<title>Vura — Find what fits your life</title>\n    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />')
          index.write_text(html)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html public/favicon.svg
          git diff --cached --quiet && exit 0
          git commit -m "Apply production UI fixes"
          git push
